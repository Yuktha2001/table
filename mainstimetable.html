<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEE Mains Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    table {
      border-collapse: collapse;
      width: 70%;
      background-color: #fff;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
    }
    th {
      background-color: #0073e6;
      color: white;
      font-weight: bold;
    }
    tr:nth-child(even) {
      background-color: #f9f9f9;
    }
    tr:hover {
      background-color: #e6f2ff;
    }
    caption {
      font-size: 1.5em;
      margin: 10px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <table>
    <caption>JEE Mains Exam Schedule</caption>
    <tr>
      <th>Subject</th>
      <th>Number of Questions</th>
      <th>Marks</th>
      <th>Duration</th>
    </tr>
    <tr>
      <td>Physics</td>
      <td>30</td>
      <td>100</td>
      <td>1 Hour</td>
    </tr>
    <tr>
      <td>Chemistry</td>
      <td>30</td>
      <td>100</td>
      <td>1 Hour</td>
    </tr>
    <tr>
      <td>Mathematics</td>
      <td>30</td>
      <td>100</td>
      <td>1 Hour</td>
    </tr>
    <tr>
      <td><strong>Total</strong></td>
      <td><strong>90</strong></td>
      <td><strong>300</strong></td>
      <td><strong>3 Hours</strong></td>
    </tr>
  </table>
</body>
</html>
